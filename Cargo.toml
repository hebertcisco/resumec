[package]
name = "resumec"
version = "0.1.0"
edition = "2024"
description = "ATS-friendly resume compiler for PDF and DOCX outputs"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hebertcisco/resumec"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
docx-rs = { version = "0.4.22", default-features = false }
printpdf = { version = "0.12.8", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
toml = "1.1.6"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
zip = "9.0.0-pre3"
