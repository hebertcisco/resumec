name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Match tag to Cargo package version
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "resumec") | .version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: resumec-linux-x86_64.tar.gz
            binary: target/release/resumec
          - os: macos-15-intel
            asset: resumec-macos-x86_64.tar.gz
            binary: target/release/resumec
          - os: windows-latest
            asset: resumec-windows-x86_64.zip
            binary: target/release/resumec.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --all-features --locked
      - run: cargo build --release --locked
      - name: Package Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.asset }}" -C target/release resumec
      - name: Package Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
