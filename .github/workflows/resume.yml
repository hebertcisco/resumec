name: resume

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate example resume
        run: cargo run -- validate examples/resume.yaml --json-output

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: Build resume outputs
        run: cargo run -- build examples/resume.yaml --format both --output-dir dist --json-output --overwrite
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resumec-outputs
          path: dist/
